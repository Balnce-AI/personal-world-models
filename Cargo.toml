[workspace]
members = [
  "crates/pwm-canonical",
  "crates/pwm-crypto",
  "crates/pwm-event",
  "crates/pwm-cli",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
proptest = "=1.11.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
tempfile = "=3.26.0"
thiserror = "=2.0.18"
unicode-normalization = "=0.1.25"
