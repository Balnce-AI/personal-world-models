[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pwm-hpl-ref"
version = "0.2.0"
description = "Executable reference implementation of Personal World Model and Human Projection Layer profiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zachary Schenkler" }]
requires-python = ">=3.11"
dependencies = ["cryptography>=45", "jsonschema>=4.20"]
keywords = ["personal-world-model", "world-model", "provenance", "privacy", "conformance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Balnce-AI/personal-world-models"
Documentation = "https://github.com/Balnce-AI/personal-world-models/tree/main/docs"
Repository = "https://github.com/Balnce-AI/personal-world-models"
Issues = "https://github.com/Balnce-AI/personal-world-models/issues"
Changelog = "https://github.com/Balnce-AI/personal-world-models/blob/main/CHANGELOG.md"
Conformance = "https://github.com/Balnce-AI/personal-world-models/tree/main/conformance"

[project.optional-dependencies]
dev = ["pytest>=8"]
research = []

[project.scripts]
pwm-hpl-demo = "pwm_hpl_ref.demo:main"
pwm-research = "pwm_hpl_ref.research_cli:main"
pwm-conformance = "pwm_hpl_ref.conformance_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.data-files]
"share/pwm-hpl-ref/schemas" = ["schemas/json-schema/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
