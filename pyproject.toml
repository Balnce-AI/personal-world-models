[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pwm-hpl-ref"
version = "0.1.0"
description = "Executable reference implementation of Personal World Model and Human Projection Layer profiles"
requires-python = ">=3.11"
dependencies = ["cryptography>=45", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pwm-hpl-demo = "pwm_hpl_ref.demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
