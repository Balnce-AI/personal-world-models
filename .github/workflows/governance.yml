name: governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  status-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python scripts/check_status.py governance/components.json
      - run: pytest tests/test_governance.py -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7

  dependency-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' pip-audit pip-licenses cyclonedx-bom
      - run: pip-audit .
      - run: pip-licenses --format=json --output-file=licenses.json
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-evidence
          path: |
            licenses.json
            sbom.json

  rust-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: python scripts/rust_supply_chain.py --output rust-licenses.json
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: SOURCE_DATE_EPOCH=1787961600 cargo cyclonedx --format json --spec-version 1.5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-supply-chain-evidence
          path: |
            rust-licenses.json
            **/*.cdx.json
