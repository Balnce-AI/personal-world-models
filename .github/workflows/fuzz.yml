name: fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  wave-01-decoders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup toolchain install nightly-2026-08-01 --profile minimal
      - run: cargo +nightly-2026-08-01 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly-2026-08-01 fuzz run canonical_decode -- -max_total_time=60
      - run: cargo +nightly-2026-08-01 fuzz run event_body_decode -- -max_total_time=60
